<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Samin 🎀 - مرحله ۴</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,200;14..32,300;14..32,400;14..32,600&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Vazirmatn', 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
    }
    body {
      background: #0b0a0e;
      color: #ece7f0;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      overflow: hidden;
      touch-action: none;
    }

    #game-screen {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background: #08070b;
      z-index: 10;
      padding: 0.5rem;
      animation: fadeIn 0.8s ease;
    }
    @keyframes fadeIn {
      0% { opacity: 0; transform: scale(0.98); }
      100% { opacity: 1; transform: scale(1); }
    }

    .game-container {
      width: 100%;
      max-width: 500px;
      height: 90vh;
      max-height: 800px;
      position: relative;
    }
    .game-surface {
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 40% 40%, #1f1a2a, #0b0910);
      border-radius: 28px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8), inset 0 0 0 1px rgba(255, 255, 255, 0.02);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 0.5rem 0.5rem 0.3rem 0.5rem;
    }
    .game-surface .glare {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 60% 20%, rgba(255, 255, 255, 0.015), transparent 50%);
      pointer-events: none;
      mix-blend-mode: overlay;
      z-index: 2;
    }

    /* ====== حروف پیدا شده ====== */
    .found-letters {
      position: relative;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
      background: rgba(10, 8, 14, 0.4);
      backdrop-filter: blur(12px);
      padding: 0.3rem 0.9rem;
      border-radius: 60px;
      border: 1px solid rgba(255, 255, 255, 0.03);
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.3);
      min-height: 34px;
      flex-shrink: 0;
      width: fit-content;
      margin: 0.2rem auto 0.3rem;
    }
    .found-letters .letter {
      font-size: 1.3rem;
      font-weight: 300;
      color: #f0c8d8;
      font-family: 'Georgia', 'Times New Roman', serif;
      text-shadow: 0 0 30px rgba(200, 100, 150, 0.15);
      transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
    }
    .found-letters .letter.hidden {
      display: none;
    }
    .found-letters .letter.found {
      animation: letterPop 0.6s cubic-bezier(0.23, 1, 0.32, 1);
    }
    .found-letters .letter.reveal {
      display: inline-block;
      animation: letterPop 0.6s cubic-bezier(0.23, 1, 0.32, 1);
    }
    @keyframes letterPop {
      0% { transform: scale(0) rotate(-20deg); opacity: 0; }
      60% { transform: scale(1.4) rotate(6deg); opacity: 1; }
      100% { transform: scale(1) rotate(0deg); }
    }
    .found-letters .heart-icon {
      color: #f0b0d0;
      font-size: 0.65rem;
      margin: 0 0.15rem;
      opacity: 0.3;
    }

    /* ====== نوار پیشرفت ====== */
    .progress-bar-wrap {
      width: 90%;
      max-width: 280px;
      height: 4px;
      background: rgba(255,255,255,0.04);
      border-radius: 10px;
      margin: 0.2rem auto 0.4rem;
      flex-shrink: 0;
      overflow: hidden;
      position: relative;
      z-index: 3;
    }
    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ff6b9d, #f0b0d0);
      border-radius: 10px;
      transition: width 0.5s cubic-bezier(0.23, 1, 0.32, 1);
    }
    .progress-label {
      text-align: center;
      font-size: 0.5rem;
      color: #6d5b7e;
      letter-spacing: 0.15em;
      margin-top: -0.1rem;
      flex-shrink: 0;
      position: relative;
      z-index: 3;
    }

    /* ====== گرید قلب‌ها ====== */
    .heart-grid-wrapper {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 4px 6px 8px 6px;
      margin: 0px 0 2px 0;
      z-index: 3;
      position: relative;
      scroll-behavior: smooth;
      min-height: 0;
    }
    .heart-grid-wrapper::-webkit-scrollbar {
      width: 3px;
    }
    .heart-grid-wrapper::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.01);
      border-radius: 10px;
    }
    .heart-grid-wrapper::-webkit-scrollbar-thumb {
      background: rgba(200, 100, 150, 0.2);
      border-radius: 10px;
    }

    .heart-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      width: 100%;
    }
    .heart-tile {
      background: rgba(30, 24, 44, 0.2);
      border-radius: 14px;
      border: 2px solid rgba(255, 255, 255, 0.03);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.6rem;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.23, 1, 0.32, 1);
      touch-action: none;
      aspect-ratio: 1 / 1;
      will-change: transform;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
      min-height: 64px;
      position: relative;
      text-shadow: 0 0 12px rgba(255,107,157,0.05);
    }
    .heart-tile:hover {
      background: rgba(50, 40, 70, 0.3);
      transform: scale(1.02);
      border-color: rgba(200, 180, 230, 0.06);
    }
    .heart-tile.selected {
      border-color: #ff6b9d;
      box-shadow: 0 0 30px rgba(255,107,157,0.25), inset 0 0 20px rgba(255,107,157,0.05);
      transform: scale(1.08);
      background: rgba(255,107,157,0.06);
      z-index: 4;
    }
    .heart-tile.matched {
      animation: heartBeat 0.7s cubic-bezier(0.23, 1, 0.32, 1);
      border-color: rgba(255,107,157,0.4);
      box-shadow: 0 0 50px rgba(255,107,157,0.15);
      background: rgba(255,107,157,0.04);
      pointer-events: none;
      cursor: default;
      transform: scale(1.02);
    }
    .heart-tile.matched .half-heart {
      animation: none;
    }
    @keyframes heartBeat {
      0% { transform: scale(1); }
      20% { transform: scale(1.2); box-shadow: 0 0 70px rgba(255,107,157,0.3); }
      40% { transform: scale(0.9); }
      60% { transform: scale(1.1); }
      80% { transform: scale(0.95); }
      100% { transform: scale(1.02); }
    }
    .heart-tile.wrong {
      animation: shakeTile 0.5s ease;
      border-color: #ff1744;
      box-shadow: 0 0 40px rgba(255,23,68,0.2);
      background: rgba(255,23,68,0.06);
    }
    @keyframes shakeTile {
      0%, 100% { transform: translateX(0) scale(1); }
      20% { transform: translateX(-8px) scale(1.02); }
      60% { transform: translateX(8px) scale(1.02); }
    }
    .heart-tile .half-heart {
      transition: all 0.3s ease;
      line-height: 1;
    }

    /* ====== فوتر ====== */
    .game-footer {
      position: relative;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.2rem;
      background: rgba(10, 8, 14, 0.4);
      backdrop-filter: blur(6px);
      padding: 0.2rem 1rem;
      border-radius: 60px;
      border: 1px solid rgba(255, 255, 255, 0.02);
      margin: 0.1rem auto 0.2rem;
      flex-shrink: 0;
      width: fit-content;
    }
    .game-footer .hint {
      color: #6d5b7e;
      font-size: 0.5rem;
      letter-spacing: 0.2em;
      white-space: nowrap;
      animation: pulseHint 2.5s infinite alternate;
    }
    @keyframes pulseHint {
      0% { opacity: 0.5; }
      100% { opacity: 1; }
    }
    .game-footer .pair-count {
      color: #f0c8d8;
      font-size: 0.55rem;
      letter-spacing: 0.05em;
      background: rgba(255,255,255,0.02);
      padding: 0.05rem 0.7rem;
      border-radius: 40px;
      border: 1px solid rgba(255,255,255,0.02);
    }
    .game-footer .pair-count span {
      color: #ff6b9d;
      font-weight: 400;
    }

    /* ====== پیام عاشقانه (موقت) ====== */
    .love-message {
      position: absolute;
      bottom: 50%;
      left: 50%;
      transform: translate(-50%, 50%) scale(0.8);
      background: rgba(10, 8, 14, 0.75);
      backdrop-filter: blur(16px);
      padding: 0.8rem 1.8rem;
      border-radius: 60px;
      border: 1px solid rgba(255,107,157,0.15);
      color: #f0c8d8;
      font-size: 1rem;
      font-weight: 300;
      letter-spacing: 0.08em;
      opacity: 0;
      pointer-events: none;
      transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
      z-index: 20;
      white-space: nowrap;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      font-family: 'Georgia', 'Times New Roman', serif;
    }
    .love-message.show {
      opacity: 1;
      transform: translate(-50%, 50%) scale(1);
    }
    .love-message .heart-emoji {
      display: inline-block;
      animation: heartFloat 1.2s infinite alternate;
    }
    @keyframes heartFloat {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(-4px) scale(1.1); }
    }

    /* ====== صفحه موفقیت ====== */
    .success-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 0.6rem;
      background: rgba(8, 7, 11, 0.85);
      backdrop-filter: blur(18px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s ease;
      border-radius: 28px;
      padding: 2rem;
      text-align: center;
      z-index: 30;
    }
    .success-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }
    .success-overlay .letter-reveal {
      font-size: clamp(4rem, 12vw, 7rem);
      font-weight: 200;
      color: #f0c8d8;
      text-shadow: 0 0 80px rgba(200, 100, 150, 0.2);
      animation: letterPop 0.8s cubic-bezier(0.23, 1, 0.32, 1);
      font-family: 'Georgia', 'Times New Roman', serif;
    }
    .success-overlay .msg {
      font-size: clamp(0.9rem, 2.5vw, 1.4rem);
      font-weight: 300;
      letter-spacing: 0.08em;
      color: #e5daf0;
      max-width: 500px;
    }
    .success-overlay .sub {
      font-size: 0.65rem;
      color: #a697bb;
      letter-spacing: 0.25em;
    }
    .timer-text {
      font-size: 0.75rem;
      color: #6d5b7e;
      letter-spacing: 0.2em;
      margin-top: 0.4rem;
    }

    /* ====== کانفتی ====== */
    .confetti-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 50;
      overflow: hidden;
    }
    .confetti {
      position: absolute;
      width: 10px;
      height: 10px;
      opacity: 0.9;
      animation: confettiFall linear forwards;
    }
    @keyframes confettiFall {
      0% { transform: translateY(-100px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }

    /* ====== ریسپانسیو ====== */
    @media (max-width: 768px) {
      .game-container {
        max-width: 100%;
        height: 85vh;
        max-height: 650px;
      }
      .game-surface {
        border-radius: 20px;
        padding: 0.4rem 0.4rem 0.2rem 0.4rem;
      }
      .heart-grid {
        gap: 6px;
      }
      .heart-tile {
        font-size: 2.2rem;
        border-radius: 12px;
        min-height: 56px;
      }
      .found-letters {
        padding: 0.25rem 0.7rem;
        min-height: 30px;
        margin: 0.2rem auto 0.25rem;
      }
      .found-letters .letter {
        font-size: 1.1rem;
      }
      .game-footer .hint {
        font-size: 0.45rem;
      }
      .game-footer .pair-count {
        font-size: 0.5rem;
        padding: 0.05rem 0.5rem;
      }
      .love-message {
        font-size: 0.85rem;
        padding: 0.6rem 1.4rem;
      }
      .progress-bar-wrap {
        max-width: 220px;
        height: 3px;
        margin: 0.1rem auto 0.3rem;
      }
    }

    @media (max-width: 600px) {
      .game-container {
        height: 92vh;
        max-height: 600px;
      }
      .game-surface {
        border-radius: 16px;
        padding: 0.3rem 0.3rem 0.15rem 0.3rem;
      }
      .heart-grid {
        gap: 5px;
      }
      .heart-tile {
        font-size: 2rem;
        border-radius: 10px;
        border-width: 1.5px;
        min-height: 50px;
      }
      .found-letters {
        padding: 0.2rem 0.6rem;
        min-height: 26px;
        gap: 0.2rem;
        margin: 0.15rem auto 0.2rem;
      }
      .found-letters .letter {
        font-size: 1rem;
      }
      .found-letters .heart-icon {
        font-size: 0.5rem;
      }
      .game-footer {
        padding: 0.15rem 0.7rem;
        gap: 0.7rem;
        margin: 0.1rem auto 0.15rem;
      }
      .game-footer .hint {
        font-size: 0.4rem;
      }
      .game-footer .pair-count {
        font-size: 0.45rem;
        padding: 0.05rem 0.4rem;
      }
      .love-message {
        font-size: 0.75rem;
        padding: 0.5rem 1.2rem;
      }
      .success-overlay {
        border-radius: 16px;
        padding: 1.2rem;
      }
      .success-overlay .letter-reveal {
        font-size: clamp(3rem, 8vw, 5rem);
      }
      .timer-text {
        font-size: 0.65rem;
      }
      .heart-grid-wrapper {
        padding: 2px 4px 4px 4px;
      }
      .progress-label {
        font-size: 0.45rem;
      }
      .progress-bar-wrap {
        max-width: 180px;
        height: 3px;
        margin: 0.05rem auto 0.2rem;
      }
    }

    @media (max-width: 400px) {
      .game-container {
        height: 95vh;
        max-height: 550px;
      }
      .game-surface {
        border-radius: 12px;
        padding: 0.2rem 0.2rem 0.1rem 0.2rem;
      }
      .heart-grid {
        gap: 4px;
      }
      .heart-tile {
        font-size: 1.6rem;
        border-radius: 8px;
        border-width: 1px;
        min-height: 42px;
      }
      .found-letters {
        padding: 0.15rem 0.5rem;
        min-height: 22px;
        gap: 0.15rem;
        margin: 0.1rem auto 0.15rem;
      }
      .found-letters .letter {
        font-size: 0.85rem;
      }
      .found-letters .heart-icon {
        font-size: 0.4rem;
      }
      .game-footer {
        padding: 0.1rem 0.5rem;
        gap: 0.5rem;
        margin: 0.05rem auto 0.1rem;
      }
      .game-footer .hint {
        font-size: 0.35rem;
      }
      .game-footer .pair-count {
        font-size: 0.4rem;
        padding: 0.03rem 0.3rem;
      }
      .love-message {
        font-size: 0.65rem;
        padding: 0.4rem 1rem;
      }
      .success-overlay {
        border-radius: 12px;
        padding: 1rem;
        gap: 0.4rem;
      }
      .success-overlay .letter-reveal {
        font-size: clamp(2.5rem, 7vw, 4rem);
      }
      .success-overlay .msg {
        font-size: 0.8rem;
      }
      .timer-text {
        font-size: 0.55rem;
      }
      .heart-grid-wrapper {
        padding: 1px 3px 3px 3px;
      }
      .progress-label {
        font-size: 0.4rem;
      }
      .progress-bar-wrap {
        max-width: 140px;
        height: 2px;
        margin: 0.05rem auto 0.15rem;
      }
    }

    @media (max-width: 320px) {
      .heart-tile {
        font-size: 1.3rem;
        min-height: 36px;
      }
      .found-letters .letter {
        font-size: 0.7rem;
      }
      .game-footer .hint {
        font-size: 0.3rem;
      }
    }

    @media (max-height: 700px) {
      .game-container {
        height: 95vh;
        max-height: 550px;
      }
      .heart-tile {
        font-size: 2rem;
        min-height: 46px;
      }
      .heart-grid {
        gap: 5px;
      }
      .found-letters {
        min-height: 24px;
        padding: 0.15rem 0.5rem;
      }
      .found-letters .letter {
        font-size: 0.9rem;
      }
    }
    @media (max-height: 600px) {
      .heart-tile {
        font-size: 1.6rem;
        min-height: 38px;
      }
      .heart-grid {
        gap: 4px;
      }
      .found-letters {
        min-height: 20px;
        padding: 0.1rem 0.4rem;
      }
      .found-letters .letter {
        font-size: 0.75rem;
      }
      .game-footer {
        padding: 0.1rem 0.5rem;
      }
      .game-footer .hint {
        font-size: 0.35rem;
      }
      .love-message {
        font-size: 0.6rem;
        padding: 0.3rem 0.8rem;
      }
      .progress-label {
        font-size: 0.35rem;
      }
      .heart-grid-wrapper {
        padding: 1px 3px 2px 3px;
      }
    }
  </style>
</head>
<body>

<div id="game-screen">
  <div class="game-container">
    <div class="game-surface" id="gameSurface">
      <div class="glare"></div>

      <!-- ====== حروف پیدا شده ====== -->
      <div class="found-letters" id="foundLetters">
        <span class="heart-icon">💗</span>
        <span class="letter found" id="letter0">د</span>
        <span class="letter found" id="letter1">خ</span>
        <span class="letter found" id="letter2">ت</span>
        <span class="letter hidden" id="letter3">ر</span>
        <span class="letter hidden" id="letter4">م</span>
        <span class="heart-icon">💗</span>
      </div>

      <!-- ====== نوار پیشرفت ====== -->
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="progressFill"></div>
      </div>
      <div class="progress-label" id="progressLabel">💗 ۰ از ۶ قلب کامل شد</div>

      <!-- ====== گرید قلب‌ها ====== -->
      <div class="heart-grid-wrapper" id="heartGridWrapper">
        <div class="heart-grid" id="heartGrid"></div>
      </div>

      <!-- ====== پیام عاشقانه ====== -->
      <div class="love-message" id="loveMessage">
        <span class="heart-emoji">💗</span> <span id="loveText">نیمه‌ات را پیدا کردی...</span>
      </div>

      <!-- ====== فوتر ====== -->
      <div class="game-footer">
        <span class="pair-count">💕 <span id="pairCount">۰</span> / ۶</span>
        <span class="hint">✦ نیمه‌ات را پیدا کن... 💗 ✦</span>
      </div>

      <!-- ====== صفحه موفقیت ====== -->
      <div class="success-overlay" id="successOverlay">
        <div class="letter-reveal" id="letterReveal">ر</div>
        <div class="msg">"نیمه‌ات رو پیدا کردی... 💕"</div>
        <div class="sub">✨ قلب‌هایت کامل شد ✨</div>
        <div class="timer-text" id="timerText">در حال انتقال به مرحله بعد...</div>
      </div>
    </div>
  </div>
</div>

<script>
  (function() {
    // ====== تنظیمات ======
    const PAIRS = [
      { id: 0, color: '#ff6b9d', left: '◀', right: '▶', emoji: '💗' },
      { id: 1, color: '#ff1744', left: '◀', right: '▶', emoji: '❤️' },
      { id: 2, color: '#ff4081', left: '◀', right: '▶', emoji: '💖' },
      { id: 3, color: '#f06292', left: '◀', right: '▶', emoji: '💕' },
      { id: 4, color: '#ec407a', left: '◀', right: '▶', emoji: '💓' },
      { id: 5, color: '#d81b60', left: '◀', right: '▶', emoji: '💘' }
    ];
    const LOVE_MESSAGES = [
      "نیمه‌ات را پیدا کردی... 💗",
      "هر قلبی یه جفت داره... ❤️",
      "تو نیمه گمشده‌ای... 💖",
      "دل تو برای کی می‌تپه؟ 💕",
      "عشق یعنی پیدا کردن هم‌رنگ... 💓",
      "قلب تو مال کیه؟ 💘"
    ];

    const heartGrid = document.getElementById('heartGrid');
    const progressFill = document.getElementById('progressFill');
    const progressLabel = document.getElementById('progressLabel');
    const pairCountSpan = document.getElementById('pairCount');
    const loveMessage = document.getElementById('loveMessage');
    const loveText = document.getElementById('loveText');
    const successOverlay = document.getElementById('successOverlay');
    const timerText = document.getElementById('timerText');
    const letterR = document.getElementById('letter3');

    let tiles = [];
    let selected = [];
    let matchedPairs = 0;
    let isLocked = false;
    let gameCompleted = false;
    let timerInterval = null;
    let messageTimeout = null;

    // ====== شافل ======
    function shuffleArray(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // ====== کانفتی ======
    function launchConfetti(count = 60, colors = ['#ff6b9d', '#ffb6c1', '#ffd1dc', '#ff8aac', '#ff4d7a']) {
      const container = document.createElement('div');
      container.className = 'confetti-container';
      for (let i = 0; i < count; i++) {
        const confetti = document.createElement('div');
        confetti.className = 'confetti';
        confetti.style.left = Math.random() * 100 + '%';
        confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
        confetti.style.width = (4 + Math.random() * 10) + 'px';
        confetti.style.height = (4 + Math.random() * 10) + 'px';
        confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
        confetti.style.animationDuration = (1.8 + Math.random() * 3) + 's';
        confetti.style.animationDelay = Math.random() * 2 + 's';
        container.appendChild(confetti);
      }
      document.body.appendChild(container);
      setTimeout(() => container.remove(), 5000);
    }

    // ====== نمایش پیام عاشقانه ======
    function showLoveMessage(index) {
      if (messageTimeout) clearTimeout(messageTimeout);
      const msg = LOVE_MESSAGES[index % LOVE_MESSAGES.length];
      loveText.textContent = msg;
      loveMessage.classList.add('show');
      messageTimeout = setTimeout(() => {
        loveMessage.classList.remove('show');
      }, 1800);
    }

    // ====== انتقال به مرحله بعد ======
    function redirectToNextLevel() {
      let countdown = 3;
      timerText.textContent = `⏳ ${countdown} ثانیه تا مرحله بعد...`;
      timerInterval = setInterval(() => {
        countdown--;
        if (countdown > 0) {
          timerText.textContent = `⏳ ${countdown} ثانیه تا مرحله بعد...`;
        } else {
          clearInterval(timerInterval);
          timerText.textContent = '🔄 در حال انتقال...';
          window.location.href = 'level5.html';
        }
      }, 1000);
    }

    // ====== بروزرسانی پیشرفت ======
    function updateProgress() {
      const pct = (matchedPairs / PAIRS.length) * 100;
      progressFill.style.width = pct + '%';
      progressLabel.textContent = `💗 ${matchedPairs} از ${PAIRS.length} قلب کامل شد`;
      pairCountSpan.textContent = matchedPairs;
    }

    // ====== شروع بازی ======
    function initGame() {
      heartGrid.innerHTML = '';
      tiles = [];
      selected = [];
      matchedPairs = 0;
      isLocked = false;
      gameCompleted = false;
      loveMessage.classList.remove('show');
      successOverlay.classList.remove('show');
      letterR.classList.add('hidden');
      letterR.classList.remove('reveal');
      updateProgress();

      // ساخت جفت‌ها (هر جفت = ۲ نیمه)
      let halfCards = [];
      PAIRS.forEach((pair, idx) => {
        halfCards.push({
          pairId: idx,
          side: 'left',
          display: pair.left,
          color: pair.color,
          emoji: pair.emoji
        });
        halfCards.push({
          pairId: idx,
          side: 'right',
          display: pair.right,
          color: pair.color,
          emoji: pair.emoji
        });
      });
      shuffleArray(halfCards);

      // تعیین تعداد ستون‌ها (4 ستون ثابت)
      heartGrid.style.gridTemplateColumns = 'repeat(4, 1fr)';

      halfCards.forEach((data, index) => {
        const tile = document.createElement('div');
        tile.className = 'heart-tile';
        tile.dataset.pairId = data.pairId;
        tile.dataset.side = data.side;
        tile.dataset.color = data.color;
        tile.dataset.matched = 'false';

        const halfSpan = document.createElement('span');
        halfSpan.className = 'half-heart';
        halfSpan.textContent = data.display;
        halfSpan.style.color = data.color;
        halfSpan.style.textShadow = `0 0 20px ${data.color}33`;
        tile.appendChild(halfSpan);

        tile.addEventListener('click', () => onTileClick(tile));
        tile.addEventListener('touchstart', (e) => {
          e.preventDefault();
          onTileClick(tile);
        }, { passive: false });

        heartGrid.appendChild(tile);
        tiles.push(tile);
      });
    }

    // ====== کلیک روی نیمه ======
    function onTileClick(tile) {
      if (isLocked) return;
      if (gameCompleted) return;
      if (tile.dataset.matched === 'true') return;
      if (selected.includes(tile)) return;
      if (selected.length >= 2) return;

      // انتخاب
      tile.classList.add('selected');
      selected.push(tile);

      if (selected.length === 2) {
        isLocked = true;
        const tile1 = selected[0];
        const tile2 = selected[1];
        const pairId1 = parseInt(tile1.dataset.pairId);
        const pairId2 = parseInt(tile2.dataset.pairId);

        if (pairId1 === pairId2) {
          // تطابق
          tile1.dataset.matched = 'true';
          tile2.dataset.matched = 'true';
          tile1.classList.remove('selected');
          tile2.classList.remove('selected');
          tile1.classList.add('matched');
          tile2.classList.add('matched');

          // تغییر شکل به قلب کامل
          const span1 = tile1.querySelector('.half-heart');
          const span2 = tile2.querySelector('.half-heart');
          const color = tile1.dataset.color;
          span1.textContent = '💗';
          span1.style.color = color;
          span1.style.textShadow = `0 0 30px ${color}66`;
          span2.textContent = '💗';
          span2.style.color = color;
          span2.style.textShadow = `0 0 30px ${color}66`;

          matchedPairs++;
          updateProgress();
          showLoveMessage(matchedPairs - 1);
          launchConfetti(25, ['#ff6b9d', '#ffb6c1', '#ffd1dc', '#ff8aac']);

          selected = [];
          isLocked = false;

          if (matchedPairs === PAIRS.length) {
            gameCompleted = true;
            setTimeout(() => {
              // نمایش حرف "ر"
              letterR.classList.remove('hidden');
              letterR.classList.add('reveal');
              launchConfetti(80, ['#ff6b9d', '#ffb6c1', '#ffd1dc', '#ff8aac', '#ff4d7a']);
              setTimeout(() => {
                successOverlay.classList.add('show');
                redirectToNextLevel();
              }, 500);
            }, 400);
          }
        } else {
          // خطا
          tile1.classList.add('wrong');
          tile2.classList.add('wrong');
          setTimeout(() => {
            tile1.classList.remove('selected', 'wrong');
            tile2.classList.remove('selected', 'wrong');
            selected = [];
            isLocked = false;
          }, 550);
        }
      }
    }

    // ====== شروع ======
    initGame();

    // ====== ریسپانسیو ======
    window.addEventListener('resize', () => {});
  })();
</script>
</body>
